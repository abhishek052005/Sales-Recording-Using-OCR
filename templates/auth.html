<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authentication - Invoice OCR Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f4f4f2;
        --panel: #ffffff;
        --panel-alt: #f8f8f8;
        --border: #d9d9d4;
        --line: #1f1f1f;
        --muted: #5b5b57;
        --shadow: rgba(17, 17, 17, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", sans-serif;
        background: linear-gradient(180deg, #efefeb 0%, #f8f8f6 100%);
        color: var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .auth-container {
        width: 100%;
        max-width: 440px;
        padding: 20px;
      }

      .topbar-brand {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px 20px;
        margin-bottom: 20px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(8px);
        box-shadow: 0 10px 30px var(--shadow);
      }

      .brand-mark {
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        background: #111111;
        color: white;
        font-weight: 800;
        letter-spacing: 0.12em;
        flex-shrink: 0;
      }

      .eyebrow {
        margin: 0;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 10px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: 1.35rem;
        letter-spacing: -0.05em;
      }

      .auth-panel {
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid var(--border);
        box-shadow: 0 12px 28px var(--shadow);
        padding: 28px 24px;
      }

      .auth-nav {
        display: flex;
        border-bottom: 1px solid var(--border);
        margin-bottom: 24px;
      }

      .auth-nav-btn {
        flex: 1;
        background: transparent;
        border: none;
        border-bottom: 2px solid transparent;
        padding: 12px;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .auth-nav-btn.active {
        color: var(--line);
        border-bottom-color: var(--line);
      }

      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .auth-form label {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-weight: 600;
        color: var(--line);
      }

      .auth-form label span {
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .auth-form input,
      .auth-form select {
        width: 100%;
        border: 1px solid var(--border);
        background: #fbfbfa;
        padding: 12px 14px;
        font-size: 0.96rem;
      }

      .auth-form input:focus,
      .auth-form select:focus {
        outline: none;
        border-color: var(--line);
      }

      .primary-btn {
        border: 1px solid var(--line);
        padding: 14px 18px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        background: var(--line);
        color: white;
        transition: opacity 0.2s ease, transform 0.2s ease;
        margin-top: 6px;
      }

      .primary-btn:hover {
        opacity: 0.96;
        transform: translateY(-1px);
      }

      .primary-btn:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .message-box {
        margin-top: 18px;
        border: 1px solid var(--border);
        padding: 12px 14px;
        font-weight: 600;
        font-size: 0.88rem;
        background: #f8f8f7;
      }

      .message-box.success {
        border-color: #111111;
        background: #f2f2f1;
      }

      .message-box.error {
        border-color: #4b4b4b;
        background: #f3f3f3;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <header class="topbar-brand">
        <div class="brand-mark">IO</div>
        <div>
          <p class="eyebrow">Invoice Operations</p>
          <h1>OCR Authentication</h1>
        </div>
      </header>

      <main class="auth-panel">
        <nav class="auth-nav">
          <button id="tabLogin" class="auth-nav-btn active" type="button">Login</button>
          <button id="tabRegister" class="auth-nav-btn" type="button">Register</button>
        </nav>

        <!-- LOGIN FORM -->
        <form id="loginForm" class="auth-form">
          <label>
            <span>Username</span>
            <input type="text" id="loginUsername" required autocomplete="username" />
          </label>
          <label>
            <span>Password</span>
            <input type="password" id="loginPassword" required autocomplete="current-password" />
          </label>
          <button type="submit" id="loginBtn" class="primary-btn">Sign In</button>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" class="auth-form hidden">
          <label>
            <span>Username</span>
            <input type="text" id="regUsername" required autocomplete="username" />
          </label>
          <label>
            <span>Password</span>
            <input type="password" id="regPassword" required autocomplete="new-password" />
          </label>
          <label>
            <span>Role</span>
            <select id="regRole">
              <option value="user">User</option>
              <option value="reviewer">Reviewer</option>
              <option value="admin">Admin</option>
            </select>
          </label>
          <button type="submit" id="registerBtn" class="primary-btn">Create Account</button>
        </form>

        <div id="authMessage" class="message-box hidden" aria-live="polite"></div>
      </main>
    </div>

    <script>
      const API_BASE_URL = '';

      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const authMessage = document.getElementById('authMessage');

      const setMessage = (type, text) => {
        authMessage.classList.remove('hidden', 'success', 'error');
        authMessage.classList.add(type);
        authMessage.textContent = text;
      };

      const clearMessage = () => {
        authMessage.classList.add('hidden');
        authMessage.textContent = '';
      };

      // Tab switching logic
      tabLogin.addEventListener('click', () => {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        clearMessage();
      });

      tabRegister.addEventListener('click', () => {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        clearMessage();
      });

      // Handle LOGIN
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearMessage();

        const submitBtn = document.getElementById('loginBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Authenticating...';

        const formData = new URLSearchParams();
        formData.append('username', document.getElementById('loginUsername').value.trim());
        formData.append('password', document.getElementById('loginPassword').value);

        try {
          const response = await fetch(`${API_BASE_URL}/token`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: formData,
          });

          let data = {};
          try {
            data = await response.json();
          } catch (e) {
            throw new Error(`Server response error (${response.status}: ${response.statusText})`);
          }

          if (!response.ok) {
            throw new Error(data.detail || data.error || 'Login failed.');
          }

          // Save Access Token in localStorage
          localStorage.setItem('access_token', data.access_token);
          setMessage('success', 'Login successful! Redirecting...');

          setTimeout(() => {
            window.location.href = '/';  
          }, 1000);
        } catch (error) {
          setMessage('error', error.message || 'Unable to log in.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      });

      // Handle REGISTER
      registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearMessage();

        const submitBtn = document.getElementById('registerBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Registering...';

        const payload = {
          username: document.getElementById('regUsername').value.trim(),
          password: document.getElementById('regPassword').value,
          role: document.getElementById('regRole').value,
        };

        try {
          const response = await fetch(`${API_BASE_URL}/register`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload),
          });

          let data = {};
          try {
            data = await response.json();
          } catch (e) {
            throw new Error(`Server response error (${response.status}: ${response.statusText})`);
          }

          if (!response.ok) {
            throw new Error(data.detail || data.error || 'Registration failed.');
          }

          setMessage('success', 'Account created successfully! Switching to login...');
          
          setTimeout(() => {
            document.getElementById('loginUsername').value = payload.username;
            tabLogin.click();
          }, 1500);
        } catch (error) {
          setMessage('error', error.message || 'Unable to register account.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }
      });
    </script>
  </body>
</html>
